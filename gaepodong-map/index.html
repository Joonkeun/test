<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>개포동 인기 스팟 지도</title>

  <!-- Leaflet.js (OpenStreetMap) — API 키 불필요 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: white;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    header h1 { font-size: 1.5rem; font-weight: 700; }
    header p  { font-size: 0.85rem; opacity: 0.85; margin-top: 2px; }

    .container {
      display: flex;
      height: calc(100vh - 80px);
    }

    /* ── 왼쪽 사이드바 ── */
    .sidebar {
      width: 320px;
      min-width: 280px;
      background: white;
      overflow-y: auto;
      box-shadow: 2px 0 8px rgba(0,0,0,0.08);
      z-index: 10;
    }

    .sidebar-title {
      padding: 16px 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #eee;
    }

    .spot-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.15s;
    }

    .spot-item:hover  { background: #f0f7ff; }
    .spot-item.active { background: #e8f0fe; border-left: 3px solid #1a73e8; }

    .spot-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .spot-meta { flex: 1; min-width: 0; }
    .spot-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 3px; }
    .spot-cat  {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .spot-desc {
      font-size: 0.78rem;
      color: #666;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── 오른쪽 지도 영역 ── */
    .map-section { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }

    /* ── 상세 패널 ── */
    .detail-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: min(480px, calc(100% - 40px));
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      padding: 24px;
      z-index: 1000;
      display: none;
      animation: slideUp 0.25s ease;
    }

    .detail-panel.visible { display: block; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .detail-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: #999;
      line-height: 1;
    }
    .detail-close:hover { color: #333; }

    .detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .detail-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .detail-name    { font-size: 1.15rem; font-weight: 700; }
    .detail-address { font-size: 0.78rem; color: #888; margin-top: 2px; }

    .detail-cat {
      display: inline-block;
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .recommend-box {
      background: #f8f9ff;
      border-left: 4px solid #1a73e8;
      border-radius: 0 8px 8px 0;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .recommend-box h4 {
      font-size: 0.8rem;
      font-weight: 700;
      color: #1a73e8;
      margin-bottom: 6px;
    }

    .recommend-box p { font-size: 0.82rem; line-height: 1.6; color: #444; }

    .reasons { display: flex; flex-direction: column; gap: 8px; }

    .reason-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.82rem;
      color: #444;
      line-height: 1.5;
    }

    .reason-item .badge {
      background: #1a73e8;
      color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>📍 개포동 인기 스팟</h1>
    <p>서울 강남구 개포동 · 마커를 클릭하면 추천 이유를 확인하세요 · OpenStreetMap 기반</p>
  </div>
</header>

<div class="container">

  <!-- 사이드바 -->
  <aside class="sidebar">
    <div class="sidebar-title">스팟 목록 · <span id="spot-count">0</span>곳</div>
    <div id="spot-list"></div>
  </aside>

  <!-- 지도 -->
  <div class="map-section">
    <div id="map"></div>

    <!-- 상세 패널 -->
    <div class="detail-panel" id="detail-panel">
      <button class="detail-close" id="detail-close">✕</button>
      <div class="detail-header">
        <div class="detail-icon" id="d-icon"></div>
        <div>
          <div class="detail-name" id="d-name"></div>
          <div class="detail-address" id="d-address"></div>
        </div>
      </div>
      <span class="detail-cat" id="d-cat"></span>
      <div class="recommend-box">
        <h4>✅ 추천 이유</h4>
        <p id="d-summary"></p>
      </div>
      <div class="reasons" id="d-reasons"></div>
    </div>
  </div>
</div>

<script>
// ── 스팟 데이터 ─────────────────────────────────────────────────────────
const SPOTS = [
  {
    id: 1,
    name: "대모산 자연공원",
    address: "서울 강남구 개포동 산 일대",
    lat: 37.4780, lng: 127.0745,
    category: "nature", catLabel: "자연·등산", icon: "⛰️",
    summary: "도심 속 천혜의 자연 힐링 공간으로, 서울 어디서나 접근하기 쉬운 도심 근교 산입니다. 사계절 내내 다양한 즐거움을 제공하며 주민들의 건강 산책로로 큰 인기를 끕니다.",
    reasons: [
      "강남 한복판에서 30분 내로 오를 수 있는 해발 293m의 아늑한 산으로, 등산 입문자부터 숙련자까지 누구나 즐길 수 있습니다.",
      "주능선에서 바라보는 강남·분당 전경이 일품이며, 야경 명소로도 손꼽힙니다.",
      "대모산→구룡산→양재시민의숲으로 이어지는 그린벨트 트레킹 코스의 시작점으로 활용됩니다.",
      "봄 진달래·벚꽃, 가을 단풍이 특히 아름다워 시즌별 포토스팟으로 유명합니다."
    ]
  },
  {
    id: 2,
    name: "구룡산 등산로",
    address: "서울 강남구 개포동 구룡산 일대",
    lat: 37.4760, lng: 127.0640,
    category: "nature", catLabel: "자연·등산", icon: "🌲",
    summary: "대모산과 능선으로 연결되어 있으며, 상대적으로 덜 알려진 조용한 힐링 코스입니다. 구룡마을을 품고 있어 도시와 자연의 경계를 체험할 수 있습니다.",
    reasons: [
      "해발 306m로 대모산보다 약간 높지만 등산로가 완만하게 잘 정비되어 있어 부담이 없습니다.",
      "도심의 마지막 달동네인 구룡마을과 맞닿아 있어 독특한 도시 경관을 체험할 수 있습니다.",
      "주말에도 붐비지 않아 조용한 자연 산책을 즐기려는 분들에게 제격입니다.",
      "인근 양재시민의숲과 연계하면 반나절 코스 트레킹이 가능합니다."
    ]
  },
  {
    id: 3,
    name: "양재천 산책로",
    address: "서울 강남구 개포동 양재천 일대",
    lat: 37.4793, lng: 127.0580,
    category: "leisure", catLabel: "산책·레저", icon: "🚶",
    summary: "개포동을 가로지르는 양재천은 사계절 내내 시민들의 러닝·자전거·산책 코스로 각광받는 도심 속 자연 하천입니다.",
    reasons: [
      "수변 생태 복원사업으로 백로, 오리 등 다양한 야생조류가 서식하며 자연 관찰 명소가 되었습니다.",
      "왕복 10km 이상의 평탄한 자전거·인라인 전용 도로가 잘 갖춰져 있어 가족 나들이에 안성맞춤입니다.",
      "벚꽃 시즌(3~4월)에는 수천 그루의 벚나무가 만개해 서울 5대 벚꽃 명소 중 하나로 꼽힙니다.",
      "야간 조명이 잘 정비되어 있어 저녁 산책·야간 조깅 코스로도 매우 인기 있습니다."
    ]
  },
  {
    id: 4,
    name: "개포 전통시장",
    address: "서울 강남구 개포로 지하상가 일대",
    lat: 37.4855, lng: 127.0630,
    category: "shopping", catLabel: "시장·쇼핑", icon: "🛒",
    summary: "강남구에서 보기 드문 정겨운 재래시장으로, 신선한 식재료와 저렴한 먹거리가 가득한 주민 친화 시장입니다.",
    reasons: [
      "강남 한복판에서 합리적인 가격으로 신선한 채소·수산·정육을 구매할 수 있어 주민들에게 높은 만족도를 줍니다.",
      "오래된 단골 가게들이 많아 정겨운 골목 정서와 함께 다양한 로컬 먹거리를 경험할 수 있습니다.",
      "순대·떡볶이·어묵 등 저렴한 분식 코너가 밀집해 있어 젊은 층에게도 인기가 높습니다.",
      "매월 문화행사와 야시장이 열려 단순 쇼핑을 넘어 지역 문화의 거점 역할을 합니다."
    ]
  },
  {
    id: 5,
    name: "개포 디에이치 아너힐즈 공원",
    address: "서울 강남구 개포동 개포로 지구단위계획구역",
    lat: 37.4820, lng: 127.0595,
    category: "landmark", catLabel: "공원·랜드마크", icon: "🏙️",
    summary: "개포지구 재개발로 탄생한 새로운 도시공원으로, 현대적 조경과 어린이 놀이시설이 어우러진 신흥 주거 명소입니다.",
    reasons: [
      "재건축 후 기부채납된 넓은 녹지 공간이 조성되어 쾌적한 도심 공원 환경을 제공합니다.",
      "최신 트렌드의 조경 설계로 인스타그램 포토스팟으로 부상, MZ 세대 방문객이 늘고 있습니다.",
      "어린이 놀이터, 운동시설, 벤치가 완비되어 가족 단위 방문객에게 최적의 공간입니다.",
      "주변 카페·상업시설과 연계한 '개포 핫플' 동선의 중심에 위치해 접근성이 탁월합니다."
    ]
  },
  {
    id: 6,
    name: "개포동 카페 거리",
    address: "서울 강남구 개포로 카페 밀집 구역",
    lat: 37.4840, lng: 127.0660,
    category: "food", catLabel: "카페·음식", icon: "☕",
    summary: "재개발 이후 젊은 카페 창업자들이 모여들며 형성된 개포동의 신흥 카페 거리입니다. 다양한 콘셉트와 메뉴로 주민과 외부 방문객 모두를 끌어들입니다.",
    reasons: [
      "스페셜티 커피 전문점부터 대형 베이커리 카페까지 다양한 형태의 카페가 밀집해 취향대로 선택 가능합니다.",
      "넓은 좌석과 조용한 분위기 덕분에 재택근무자·스터디족에게 '강남 속 조용한 카페 성지'로 알려졌습니다.",
      "인근 양재천·대모산 산책 후 마무리 코스로 자연스럽게 연계되어 체류 시간이 길어집니다.",
      "주기적으로 팝업 스토어와 플리마켓이 열려 단순 카페 방문을 넘어 로컬 문화 체험이 가능합니다."
    ]
  },
  {
    id: 7,
    name: "서울 도시농업공원 (개포)",
    address: "서울 강남구 개포동 도시농업공원",
    lat: 37.4800, lng: 127.0700,
    category: "culture", catLabel: "문화·체험", icon: "🌱",
    summary: "강남구가 운영하는 도시농업체험 공간으로, 어린이부터 노인까지 텃밭 체험, 식물교육, 가족 프로그램을 제공하는 복합 문화 공간입니다.",
    reasons: [
      "직접 채소를 심고 수확하는 텃밭 분양 프로그램이 운영되어 도심 속 농경 체험이 가능합니다.",
      "강남구 내 몇 안 되는 무료 생태 체험 공간으로, 어린이 자연 교육에 특화된 프로그램이 풍부합니다.",
      "계절별 꽃 단지와 작물 전시로 사계절 내내 다른 풍경을 즐길 수 있습니다.",
      "인근 주민 커뮤니티의 중심지로 각종 문화·취미 모임의 거점이 되고 있습니다."
    ]
  },
  {
    id: 8,
    name: "개포 키즈카페 & 문화복합시설",
    address: "서울 강남구 개포동 문화복합시설 일대",
    lat: 37.4870, lng: 127.0610,
    category: "culture", catLabel: "문화·체험", icon: "🎨",
    summary: "개포동 재개발과 함께 신설된 문화복합시설로, 공공도서관·키즈카페·강좌실이 통합된 원스톱 가족 문화공간입니다.",
    reasons: [
      "강남구립 도서관과 키즈 문화센터가 결합된 공간으로, 아이와 부모 모두 각자의 시간을 효율적으로 활용할 수 있습니다.",
      "영·유아 대상 그림책 전문 코너와 놀이형 학습공간이 특화되어 학부모 사이에서 입소문이 자자합니다.",
      "무료 또는 저렴한 수강료로 운영되는 문화강좌가 다양해 실질적인 주민 복지 역할을 합니다.",
      "주말 가족 나들이 코스로 양재천 산책 → 도서관 방문 → 카페 거리를 묶는 '개포 반나절 루트'의 핵심 거점입니다."
    ]
  }
];

// ── 카테고리 색상 ────────────────────────────────────────────────────────
const CAT = {
  nature:   { bg: '#e8f5e9', text: '#2e7d32', pin: '#43a047' },
  food:     { bg: '#fff3e0', text: '#e65100', pin: '#fb8c00' },
  culture:  { bg: '#f3e5f5', text: '#6a1b9a', pin: '#8e24aa' },
  leisure:  { bg: '#e3f2fd', text: '#1565c0', pin: '#1e88e5' },
  shopping: { bg: '#fce4ec', text: '#880e4f', pin: '#e91e63' },
  landmark: { bg: '#f1f8e9', text: '#33691e', pin: '#7cb342' },
};

// ── Leaflet 지도 초기화 ──────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([37.4820, 127.0645], 15);

// OpenStreetMap 타일 (무료, 승인 불필요)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

// ── 마커 생성 ────────────────────────────────────────────────────────────
SPOTS.forEach(spot => {
  const c = CAT[spot.category] || CAT.landmark;

  // SVG 핀 마커
  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="38" height="50" viewBox="0 0 38 50">
      <path d="M19 0C8.51 0 0 8.51 0 19c0 14.25 19 31 19 31S38 33.25 38 19C38 8.51 29.49 0 19 0z" fill="${c.pin}" stroke="white" stroke-width="2"/>
      <circle cx="19" cy="19" r="11" fill="white"/>
      <text x="19" y="24" text-anchor="middle" font-size="13">${spot.icon}</text>
    </svg>`;

  const icon = L.divIcon({
    html: svg,
    iconSize: [38, 50],
    iconAnchor: [19, 50],
    popupAnchor: [0, -52],
    className: '',
  });

  const marker = L.marker([spot.lat, spot.lng], { icon }).addTo(map);
  marker.on('click', () => openDetail(spot));
});

// ── 사이드바 렌더링 ──────────────────────────────────────────────────────
document.getElementById('spot-count').textContent = SPOTS.length;
document.getElementById('spot-list').innerHTML = SPOTS.map(spot => {
  const c = CAT[spot.category] || {};
  return `
    <div class="spot-item" id="list-${spot.id}" onclick="openDetail(SPOTS[${spot.id - 1}])">
      <div class="spot-icon" style="background:${c.bg}; color:${c.text}">${spot.icon}</div>
      <div class="spot-meta">
        <div class="spot-name">${spot.name}</div>
        <span class="spot-cat" style="background:${c.bg}; color:${c.text}">${spot.catLabel}</span>
        <div class="spot-desc">${spot.summary}</div>
      </div>
    </div>`;
}).join('');

// ── 상세 패널 열기 ───────────────────────────────────────────────────────
function openDetail(spot) {
  document.querySelectorAll('.spot-item').forEach(el => el.classList.remove('active'));
  const listEl = document.getElementById(`list-${spot.id}`);
  if (listEl) {
    listEl.classList.add('active');
    listEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  map.flyTo([spot.lat, spot.lng], 16, { duration: 0.8 });

  const c = CAT[spot.category] || {};
  document.getElementById('d-icon').textContent       = spot.icon;
  document.getElementById('d-icon').style.background  = c.bg;
  document.getElementById('d-name').textContent       = spot.name;
  document.getElementById('d-address').textContent    = spot.address;
  document.getElementById('d-cat').textContent        = spot.catLabel;
  document.getElementById('d-cat').style.background   = c.bg;
  document.getElementById('d-cat').style.color        = c.text;
  document.getElementById('d-summary').textContent    = spot.summary;

  document.getElementById('d-reasons').innerHTML = spot.reasons.map((r, i) => `
    <div class="reason-item">
      <span class="badge">${i + 1}</span>
      <span>${r}</span>
    </div>`).join('');

  document.getElementById('detail-panel').classList.add('visible');
}

document.getElementById('detail-close').addEventListener('click', () => {
  document.getElementById('detail-panel').classList.remove('visible');
  document.querySelectorAll('.spot-item').forEach(el => el.classList.remove('active'));
});
</script>
</body>
</html>
